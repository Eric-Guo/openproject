allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  th-analytics: true

minimumReleaseAgeExclude:
  - '@mixtint/primer-view-components@0.86.1'

nodeLinker: hoisted

onlyBuiltDependencies:
  - core-js
  - es5-ext
  - esbuild
  - highlight.js
  - nice-napi
