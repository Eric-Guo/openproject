name: "Hocuspocus / Tests"
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'extensions/op-blocknote-hocuspocus/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./extensions/op-blocknote-hocuspocus

jobs:
  units:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: extensions/op-blocknote-hocuspocus/pnpm-lock.yaml

      - name: Install Dependencies
        id: pnpm-ci
        run: pnpm install --frozen-lockfile

      - name: run tests
        id: pnpm-test
        run: CI=1 pnpm test
