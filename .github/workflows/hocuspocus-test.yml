name: "Hocuspocus / Tests"
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'extensions/op-blocknote-hocuspocus/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./extensions/op-blocknote-hocuspocus

jobs:
  units:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19'
          cache: pnpm
          cache-dependency-path: extensions/op-blocknote-hocuspocus/pnpm-lock.yaml

      - name: Install Dependencies
        id: pnpm-install
        run: pnpm install --frozen-lockfile

      - name: run tests
        id: pnpm-test
        run: CI=1 pnpm test
