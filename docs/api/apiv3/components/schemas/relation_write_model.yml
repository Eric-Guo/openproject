# Schema: RelationWriteModel
---
type: object
description: |-
  Use `lag` for the interval between a predecessor and successor. The unsupported `delay` property
  is rejected with HTTP 422, including when its value is null or `lag` is also provided.
not:
  required:
    - delay
required:
  - _links
  - type
properties:
  type:
    type: string
    description: The relation type.
    enum:
      - relates
      - duplicates
      - duplicated
      - blocks
      - blocked
      - precedes
      - follows
      - includes
      - partof
      - requires
      - required
  description:
    type:
      - 'string'
      - 'null'
    description: A descriptive text for the relation.
  lag:
    type:
      - 'integer'
      - 'null'
    description: |-
      The number of working days between the predecessor's finish and the successor's start.
      Only applies to `precedes` and `follows`. For `follows`, `from` is the successor and `to` is the predecessor;
      for `precedes`, the direction is reversed. A lag of 0 does not mean a same-day start.
    minimum: -2000
    maximum: 2000
  _links:
    type: object
    properties:
      to:
        allOf:
          - $ref: './link.yml'
          - description: |-
              The work package the relation ends in. Only available on relation creation, not on update.
              
              **Resource**: WorkPackage
              
              # Conditions
              
              **Permission**: view work packages
